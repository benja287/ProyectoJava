<header class="app-header">
  <a [routerLink]="irHome()" class="brand">{{ title }}</a>
  <nav>
    <a routerLink="/">Inicio</a>
    @if (usuario) {
      <span class="user-info">{{ usuario.nombre }} {{ usuario.apellido }}</span>
      @if (rolesDisponibles.length > 0) {
        <label class="rol-select">
          Rol
          <select [value]="usuario.rolActual ?? ''" (change)="cambiarRol($event)">
            @for (r of rolesDisponibles; track r) {
              <option [value]="r">{{ r }}</option>
            }
          </select>
        </label>
      }
      <a [routerLink]="loginService.homeRoute()">Mi panel</a>
      <button type="button" class="btn-header" (click)="logout()">Salir</button>
    } @else {
      <a routerLink="/login">Ingresar</a>
      <a routerLink="/registro">Registrarme</a>
    }
  </nav>
</header>

@if (rolError) {
  <p class="rol-error">{{ rolError }}</p>
}

<main class="app-main">
  <router-outlet />
</main>

<footer class="app-footer">
  Entrega 5 — Angular + REST Jersey · <code>frontend/</code>
</footer>
