<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JYAA — Práctica 8 Angular</title>
  <!--
    base href="/" → el Router de Angular interpreta rutas desde la raíz del sitio.
    En producción (ROOT.war) la app vive en https://grupo1.../
  -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>window.__JYAA_BUILD__='__JYAA_BUILD_ID__';</script>
  <script>
    (function () {
      var embedded = window.__JYAA_BUILD__;
      if (!embedded || embedded === '__JYAA_BUILD_ID__' || embedded === 'dev') return;

      function forceReload(remoteBuild) {
        try {
          var k = 'jyaa-app-reload-attempt';
          if (sessionStorage.getItem(k) === remoteBuild) return;
          sessionStorage.setItem(k, remoteBuild);
        } catch (e) {}
        var url = new URL(location.href);
        url.searchParams.set('_cb', remoteBuild);
        location.replace(url.href);
      }

      fetch('/version.json?_=' + Date.now(), {
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache', Pragma: 'no-cache' },
      })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (!data || !data.build || data.build === embedded) return;
          forceReload(data.build);
        })
        .catch(function () {});
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <!--
    Contenedor vacío al cargar. Angular busca selector 'app-root' y monta AppComponent.
    El build agrega <script src="main-....js"> (en dev lo inyecta ng serve).
  -->
  <app-root></app-root>
</body>
</html>
