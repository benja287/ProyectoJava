<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>V Congreso Argentino de Agroecología</title>
  <!--
    base href="/" → el Router de Angular interpreta rutas desde la raíz del sitio.
    En producción (ROOT.war) la app vive en https://grupo1.../
  -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>window.__JYAA_BUILD__='__JYAA_BUILD_ID__';</script>
  <script>
    (function () {
      var embedded = window.__JYAA_BUILD__;
      if (!embedded || embedded === '__JYAA_BUILD_ID__' || embedded === 'dev') return;

      function clearReloadAttempts() {
        try {
          var keys = [];
          for (var i = 0; i < sessionStorage.length; i++) {
            var key = sessionStorage.key(i);
            if (key && key.indexOf('jyaa-app-reload-attempt:') === 0) keys.push(key);
          }
          keys.forEach(function (k) { sessionStorage.removeItem(k); });
        } catch (e) {}
      }

      function forceReload(remoteBuild) {
        var attemptKey = 'jyaa-app-reload-attempt:' + embedded + '->' + remoteBuild;
        try {
          if (sessionStorage.getItem(attemptKey) === '1') return;
          sessionStorage.setItem(attemptKey, '1');
        } catch (e) {}
        var url = new URL(location.href);
        url.searchParams.set('_cb', remoteBuild);
        url.searchParams.set('_t', String(Date.now()));
        location.replace(url.href);
      }

      // XHR síncrono: bloquea la carga de main.js hasta decidir si hay que recargar
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/version.json?_=' + Date.now(), false);
        xhr.setRequestHeader('Cache-Control', 'no-cache');
        xhr.setRequestHeader('Pragma', 'no-cache');
        xhr.send(null);
        if (xhr.status === 200) {
          var data = JSON.parse(xhr.responseText);
          if (data && data.build) {
            if (data.build === embedded) {
              clearReloadAttempts();
            } else {
              forceReload(data.build);
            }
          }
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <!--
    Contenedor vacío al cargar. Angular busca selector 'app-root' y monta AppComponent.
    El build agrega <script src="main-....js"> (en dev lo inyecta ng serve).
  -->
  <app-root></app-root>
</body>
</html>
